name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Garde l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: countdown-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publie l'APK dans les Releases (téléchargement direct depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Countdown.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Countdown.apk --title "Dernière version" --notes "APK à installer sur Android" --target "${{ github.sha }}"
